### MarsOS - preseed da VM construtora (template para "VBoxManage unattended")
### Instala um Debian 13 minimo com live-build, SSH por chave e sudo sem senha.
### __SSH_PUBKEY__ e substituido pelo script criar-vm-construtora.ps1.

# Idioma / teclado
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select us

# Rede
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string @@VBOX_INSERT_HOSTNAME_WITHOUT_DOMAIN@@
d-i netcfg/get_domain string @@VBOX_INSERT_HOSTNAME_DOMAIN@@
d-i hw-detect/load_firmware boolean false

# Espelho
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/use_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates

# Relogio
d-i clock-setup/utc boolean true
d-i time/zone string @@VBOX_INSERT_TIME_ZONE_UX@@
d-i clock-setup/ntp boolean true

# Disco (apaga tudo do disco virtual)
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Usuario
d-i passwd/root-login boolean false
d-i passwd/user-fullname string @@VBOX_INSERT_USER_FULL_NAME@@
d-i passwd/username string @@VBOX_INSERT_USER_LOGIN@@
d-i passwd/user-password-crypted password @@VBOX_INSERT_USER_PASSWORD_SHACRYPT512@@
d-i passwd/user-default-groups string sudo

# Pacotes: so o minimo + ferramentas de build da ISO
d-i base-installer/kernel/override-image string linux-image-amd64
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string sudo live-build debootstrap rsync curl ca-certificates python3-pil xorriso
d-i pkgsel/upgrade select none
d-i pkgsel/install-language-support boolean false
popularity-contest popularity-contest/participate boolean false

# Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default
d-i finish-install/reboot_in_progress note

# Chave SSH + sudo sem senha para o usuario construtor
d-i preseed/late_command string \
  mkdir -p /target/home/@@VBOX_INSERT_USER_LOGIN@@/.ssh; \
  echo '__SSH_PUBKEY__' > /target/home/@@VBOX_INSERT_USER_LOGIN@@/.ssh/authorized_keys; \
  chmod 700 /target/home/@@VBOX_INSERT_USER_LOGIN@@/.ssh; \
  chmod 600 /target/home/@@VBOX_INSERT_USER_LOGIN@@/.ssh/authorized_keys; \
  in-target chown -R @@VBOX_INSERT_USER_LOGIN@@:@@VBOX_INSERT_USER_LOGIN@@ /home/@@VBOX_INSERT_USER_LOGIN@@/.ssh; \
  echo '@@VBOX_INSERT_USER_LOGIN@@ ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/90-construtora; \
  chmod 440 /target/etc/sudoers.d/90-construtora
