source /boot/grub/config.cfg
set timeout=10

menuentry "Start MarsOS" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "MarsOS with persistence (keeps everything)" --hotkey=p {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence
	initrd	@INITRD_LIVE@
}

menuentry "MarsOS in RAM (no USB stick)" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}

menuentry "MarsOS in safe mode" --hotkey=m {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ noapic noapm nodma nomce nosmp nomodeset
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI firmware settings" --hotkey=f {
			fwsetup
		}
	fi

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
