# MarsOS - boot menu of the installed system (read by update-grub).
GRUB_DISTRIBUTOR="MarsOS"
GRUB_TIMEOUT=5
GRUB_BACKGROUND="/usr/share/marsos/boot/grub.png"
# Martian text-console palette, the same one the live system uses
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT vt.default_red=26,172,143,217,90,142,111,232,81,229,184,255,143,199,159,255 vt.default_grn=17,47,154,122,111,74,163,201,50,68,196,137,176,122,214,241 vt.default_blu=23,68,74,43,140,106,160,168,62,56,106,51,217,154,208,220"
