# MarsOS - default answers for the text installer (debian-installer in "live" mode,
# which copies the live system to the disk). Everything else is asked as usual.
# "seen false" = the value is only a suggestion and the question is still shown.

# Computer name and first user
d-i netcfg/get_hostname string marte
d-i netcfg/get_hostname seen false
d-i passwd/user-fullname string Astronauta
d-i passwd/user-fullname seen false
d-i passwd/username string astronauta
d-i passwd/username seen false

# The system comes from the ISO: don't ask to scan other CDs/DVDs
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
popularity-contest popularity-contest/participate boolean false

# Installed system: drop the live-session hint (user astronauta / password live)
# from the login screen
d-i preseed/late_command string in-target sed -i -e '/astronauta/d' /etc/issue
