source /boot/grub/config.cfg
set timeout=10

menuentry "Iniciar o MarsOS" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "MarsOS com persistencia (salva tudo)" --hotkey=p {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence
	initrd	@INITRD_LIVE@
}

menuentry "MarsOS na RAM (sem pendrive)" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}

menuentry "MarsOS em modo seguro" --hotkey=m {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ noapic noapm nodma nomce nosmp nomodeset
	initrd	@INITRD_LIVE@
}

submenu 'Utilitarios...' --hotkey=u {

	source /boot/grub/theme.cfg

	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "Configuracao do firmware (UEFI)" --hotkey=f {
			fwsetup
		}
	fi

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verificar a integridade da midia" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
