source /boot/grub/config.cfg
set timeout=10

menuentry "Start MarsOS · English" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=en_US.UTF-8 keyboard-layouts=us timezone=Etc/UTC
	initrd	@INITRD_LIVE@
}

menuentry "Iniciar o MarsOS · Português" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=pt_BR.UTF-8 keyboard-layouts=br timezone=America/Sao_Paulo
	initrd	@INITRD_LIVE@
}

menuentry "Persistence · English" --hotkey=p {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence locales=en_US.UTF-8 keyboard-layouts=us timezone=Etc/UTC
	initrd	@INITRD_LIVE@
}

menuentry "Persistência · Português" --hotkey=e {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence locales=pt_BR.UTF-8 keyboard-layouts=br timezone=America/Sao_Paulo
	initrd	@INITRD_LIVE@
}

if @ENABLE_INSTALL_MENU@; then
menuentry "Install MarsOS · Instalar o MarsOS" --hotkey=n {
	linux	@KERNEL_DI@ @APPEND_DI@
	initrd	@INITRD_DI@
}
fi

submenu "More options · Mais opções ..." --hotkey=m {

	source /boot/grub/theme.cfg

	menuentry "In RAM, no USB stick · English" --hotkey=r {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram locales=en_US.UTF-8 keyboard-layouts=us timezone=Etc/UTC
		initrd	@INITRD_LIVE@
	}

	menuentry "Na RAM, sem pendrive · Português" --hotkey=a {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram locales=pt_BR.UTF-8 keyboard-layouts=br timezone=America/Sao_Paulo
		initrd	@INITRD_LIVE@
	}

	menuentry "Safe mode · English" --hotkey=f {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ noapic noapm nodma nomce nosmp nomodeset locales=en_US.UTF-8 keyboard-layouts=us timezone=Etc/UTC
		initrd	@INITRD_LIVE@
	}

	menuentry "Modo seguro · Português" --hotkey=g {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ noapic noapm nodma nomce nosmp nomodeset locales=pt_BR.UTF-8 keyboard-layouts=br timezone=America/Sao_Paulo
		initrd	@INITRD_LIVE@
	}

	if @ENABLE_INSTALL_MENU@; then
	menuentry "Expert install · Instalação avançada" --hotkey=x {
		linux	@KERNEL_DI@ priority=low @APPEND_DI@
		initrd	@INITRD_DI@
	}
	fi
}

submenu "Utilities · Utilitários ..." --hotkey=u {

	source /boot/grub/theme.cfg

	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI firmware settings · Configuração do firmware" --hotkey=f {
			fwsetup
		}
	fi

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Check the media · Verificar a mídia" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
